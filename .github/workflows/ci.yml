name: CI

on:
  push:
    branches: ["**"] # branches only: a v* tag push is release.yml's job (it calls this file)
  pull_request:
  workflow_call: # release.yml runs this same suite before publishing

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # web/dist is gitignored, so there is no committed build to diff against.
  # What can go wrong instead is publishing a package without the UI — check the tarball.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: cd web && npm ci && npm run build
      - name: Packed tarball contains the built web UI
        run: npm pack --dry-run --json | node scripts/check-pack.js
