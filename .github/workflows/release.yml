name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json version
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${pkg}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg} (expected v${pkg})"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      # no dependency cache here on purpose: a poisoned cache must not reach a published package
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: cd web && npm ci && npm run build
      - run: npm pack --dry-run --json | node scripts/check-pack.js
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
